spring.application.name=resarch-mate

# Server port
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/research_mate
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Semantic Scholar API
semantic.scholar.api-key=${SEMANTIC_SCHOLAR_API_KEY}
semantic.scholar.base-url=https://api.semanticscholar.org/graph/v1
semantic.scholar.recommendations-url=https://api.semanticscholar.org/recommendations/v1

# Ollama (Spring AI)
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2
spring.ai.ollama.chat.options.temperature=0.7

# Caching
spring.cache.type=caffeine

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000